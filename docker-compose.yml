services:
  backend:
    build:
      context: ./backend
    environment:
      ROADVISION_DATA_DIR: /app/data
      ROADVISION_MODEL_PATH: ${ROADVISION_MODEL_PATH:-yolov8n.pt}
      ROADVISION_MAX_UPLOAD_MB: ${ROADVISION_MAX_UPLOAD_MB:-250}
      ROADVISION_VIDEO_WORKERS: ${ROADVISION_VIDEO_WORKERS:-1}
      ROADVISION_RETENTION_DAYS: ${ROADVISION_RETENTION_DAYS:-30}
      ROADVISION_AUTH_REQUIRED: ${ROADVISION_AUTH_REQUIRED:-false}
      ROADVISION_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
